<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Last Light</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23050505'/%3E%3Crect x='6' y='1' width='4' height='1' fill='%235a4630'/%3E%3Crect x='4' y='3' width='8' height='1' fill='%234a3a26'/%3E%3Crect x='4' y='4' width='1' height='8' fill='%234a3a26'/%3E%3Crect x='11' y='4' width='1' height='8' fill='%234a3a26'/%3E%3Crect x='5' y='4' width='6' height='8' fill='%23e8a94a'/%3E%3Crect x='7' y='6' width='2' height='4' fill='%23fff1c8'/%3E%3Crect x='4' y='12' width='8' height='2' fill='%234a3a26'/%3E%3C/svg%3E">
<style>
  /*
    Last Light. Every pixel lives on one 320 x 192 grid, including the text,
    which uses a hand-made 5 x 7 font so nothing is borrowed and it works offline.
  */
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050505;overflow:hidden}
  body{display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
  #wrap{position:relative;display:flex}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;cursor:default}
  canvas:focus-visible{outline:2px solid #e8a94a;outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---- touch controls: only on touch screens ---- */
  #touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:2;zoom:var(--tc-zoom,1);font:12px/1 "Silkscreen",ui-monospace,monospace;letter-spacing:.06em;color:#f3e6cf}
  body[data-input="touch"] #touch{display:block}
  #touch button,#stick{pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none}
  #touch button{position:absolute;display:grid;place-items:center;width:64px;height:64px;padding:0;border-radius:50%;
    font:inherit;color:inherit;background:rgba(232,169,74,.16);border:2px solid rgba(243,230,207,.35);opacity:var(--tc-alpha,.75);
    transition:transform 60ms,background 60ms}
  #touch button.on{transform:scale(.92);background:rgba(232,169,74,.45);opacity:1}
  #touch button:focus-visible{outline:2px dashed #e8a94a;outline-offset:3px}
  #stick{position:absolute;left:calc(20px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));
    width:136px;height:136px;border-radius:50%;background:rgba(243,230,207,.08);border:2px solid rgba(243,230,207,.3);opacity:var(--tc-alpha,.75)}
  /* left-handed: mirror the layout, then un-mirror each button so its label reads normally */
  #touch.lefty{transform:scaleX(-1)}
  #touch.lefty button{transform:scaleX(-1)}
  #touch.lefty button.on{transform:scaleX(-1) scale(.92)}
  #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;
    background:rgba(232,169,74,.35);border:2px solid rgba(243,230,207,.5)}
  /* right thumb: Use is the big one, the rest sit around it */
  #b-use{right:calc(28px + env(safe-area-inset-right));bottom:calc(36px + env(safe-area-inset-bottom));width:76px!important;height:76px!important}
  #b-run{right:calc(116px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom))}
  #b-pour{right:calc(20px + env(safe-area-inset-right));bottom:calc(124px + env(safe-area-inset-bottom))}
  #b-down{right:calc(104px + env(safe-area-inset-right));bottom:calc(100px + env(safe-area-inset-bottom));width:52px!important;height:52px!important}
  #b-up{right:calc(76px + env(safe-area-inset-right));bottom:calc(164px + env(safe-area-inset-bottom));width:52px!important;height:52px!important}
  #b-pause{top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));height:44px!important;border-radius:8px!important}
  #b-inv,#b-book{top:calc(12px + env(safe-area-inset-top));height:44px!important;border-radius:8px!important}
  #b-inv{right:calc(12px + env(safe-area-inset-right))}
  #b-book{right:calc(84px + env(safe-area-inset-right))}
  #b-reload{right:calc(20px + env(safe-area-inset-right));bottom:calc(124px + env(safe-area-inset-bottom))}
  #touch #b-reload{display:none}
  body[data-cam="1"] #touch #b-reload{display:grid}
  body[data-cam="1"] #touch #b-pour{display:none}
  body:not([data-mode="play"]) #touch .top{display:none}
  /* movement and actions only while playing; Pause also shows in the pause menu */
  body:not([data-mode="play"]) #stick, body:not([data-mode="play"]) #touch .act{display:none}
  body:not([data-mode="play"]):not([data-mode="pause"]) #b-pause{display:none}

  /* ---- held upright on a touch screen: ask to turn the phone ---- */
  #turn{display:none;position:fixed;inset:0;z-index:3;background:#050505;color:#f3e6cf;
    place-content:center;justify-items:center;gap:18px;text-align:center;font:16px/1.4 "Pixelify Sans",system-ui,sans-serif;padding:24px}
  #turn b{font:700 18px/1 "Silkscreen",ui-monospace,monospace;letter-spacing:.06em;color:#e8a94a}
  #turn i{width:44px;height:72px;border:3px solid #f3e6cf;border-radius:6px;animation:tilt 1.6s ease-in-out infinite}
  @keyframes tilt{0%,30%{transform:none}60%,100%{transform:rotate(-90deg)}}
  @media (prefers-reduced-motion:reduce){#turn i{animation:none;transform:rotate(-90deg)}}
  @media (orientation:portrait){body[data-input="touch"] #turn{display:grid}}

  @font-face{font-family:"Silkscreen";src:url(../../fonts/silkscreen-400.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Silkscreen";src:url(../../fonts/silkscreen-700.woff2) format("woff2");font-weight:700;font-display:swap}
  @font-face{font-family:"Pixelify Sans";src:url(../../fonts/pixelify-400.woff2) format("woff2");font-display:swap}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="pl" aria-hidden="true"></canvas>
  <canvas id="c" width="320" height="192" tabindex="0" aria-label="Last Light. Press Enter to start."></canvas>
  <canvas id="pr" aria-hidden="true"></canvas>
  <p class="sr" id="sr" aria-live="polite"></p>
</div>
<div id="touch" aria-hidden="true">
  <div id="stick"><div id="knob"></div></div>
  <button type="button" class="act" id="b-use" data-key="Space">USE</button>
  <button type="button" class="act" id="b-run" data-key="ShiftLeft" data-hold>RUN</button>
  <button type="button" class="act" id="b-pour" data-key="KeyF">POUR</button>
  <button type="button" class="act" id="b-down" data-key="KeyQ">-</button>
  <button type="button" class="act" id="b-up" data-key="KeyE">+</button>
  <button type="button" id="b-pause" data-key="Escape">PAUSE</button>
  <button type="button" class="act" id="b-reload" data-key="KeyR">LOAD</button>
  <button type="button" class="top" id="b-inv" data-key="Tab">BAG</button>
  <button type="button" class="top" id="b-book" data-key="KeyB">BOOK</button>
</div>
<div id="turn" role="alert"><i></i><b>TURN YOUR PHONE</b><span>Last Light plays sideways.</span></div>

<script src="../../errlog.js"></script>
<script src="enemies.js"></script>
<script src="game.js"></script>
</body>
</html>
