<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 20" shape-rendering="crispEdges">
  <!-- handle -->
  <rect x="6" y="0" width="4" height="1" fill="#8a6230"/>
  <rect x="5" y="1" width="1" height="2" fill="#8a6230"/>
  <rect x="10" y="1" width="1" height="2" fill="#8a6230"/>
  <!-- cap -->
  <rect x="5" y="3" width="6" height="1" fill="#a87a3c"/>
  <rect x="4" y="4" width="8" height="1" fill="#6b4a22"/>
  <!-- glass + frame -->
  <rect x="5" y="5" width="6" height="9" fill="#ffb347" fill-opacity=".22"/>
  <rect x="4" y="5" width="1" height="9" fill="#6b4a22"/>
  <rect x="11" y="5" width="1" height="9" fill="#6b4a22"/>
  <!-- flame -->
  <rect x="8" y="7" width="1" height="1" fill="#ffb000"/>
  <rect x="7" y="8" width="2" height="1" fill="#ffb000"/>
  <rect x="6" y="9" width="4" height="2" fill="#ffb000"/>
  <rect x="7" y="9" width="2" height="2" fill="#fff2c4"/>
  <rect x="7" y="11" width="2" height="1" fill="#ff8a00"/>
  <rect x="7" y="12" width="2" height="1" fill="#5a3d1a"/>
  <!-- base -->
  <rect x="4" y="14" width="8" height="1" fill="#a87a3c"/>
  <rect x="5" y="15" width="6" height="1" fill="#6b4a22"/>
</svg>
